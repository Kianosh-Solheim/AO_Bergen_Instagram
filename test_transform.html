<!DOCTYPE html>
<html>
<head>
<style>
  .container {
    width: 200px;
    height: 300px;
    border: 2px solid red;
    overflow: hidden;
    margin: 50px;
  }
  .img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>
  <div class="container">
    <img src="https://via.placeholder.com/200x400" class="img" style="object-position: 0% 50%; transform: scale(2); transform-origin: 0% 50%;" />
  </div>
</body>
</html>
