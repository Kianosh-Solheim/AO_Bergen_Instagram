<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="purpleGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable cropping -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Safe-zone centered container (scaled to 78% so no elements touch edge when Android masks to circle/squircle) -->
  <g transform="translate(56, 56) scale(0.78)">
    <!-- Primary Carousel Slide (4:5 Aspect Ratio) -->
    <rect x="146" y="80" width="220" height="275" rx="24" fill="#292524" stroke="#71717a" stroke-width="4" />

    <!-- Slide Header Bar Accent -->
    <rect x="170" y="104" width="64" height="12" rx="6" fill="url(#purpleGradMask)" />

    <!-- Instagram 4:5 Content Block (Mockup image area) -->
    <rect x="170" y="130" width="172" height="135" rx="14" fill="#18181b" />
    <circle cx="216" cy="178" r="22" fill="url(#purpleGradMask)" opacity="0.9" />
    <path d="M182 242 L230 198 L270 232 L306 206 L330 242 Z" fill="#3f3f46" />

    <!-- Text lines mockup -->
    <rect x="170" y="282" width="140" height="10" rx="5" fill="#f4f4f5" />
    <rect x="170" y="300" width="90" height="8" rx="4" fill="#a1a1aa" />
    <rect x="170" y="316" width="120" height="8" rx="4" fill="#71717a" />

    <!-- "AO" Floating Badge -->
    <g transform="translate(86, 272)">
      <rect width="112" height="112" rx="28" fill="url(#purpleGradMask)" />
      <rect x="4" y="4" width="104" height="104" rx="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" />
      <text x="56" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">AO</text>
    </g>

    <!-- Carousel Dots Indicator (Bottom) -->
    <circle cx="236" cy="390" r="6" fill="#a855f7" />
    <circle cx="256" cy="390" r="6" fill="#71717a" />
    <circle cx="276" cy="390" r="6" fill="#71717a" />
  </g>
</svg>
