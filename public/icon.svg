<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Glowing Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#purpleGrad)" stroke-width="8" opacity="0.6" />

  <!-- Carousel Slide Back Mockup (Tilted/Offset) -->
  <rect x="156" y="96" width="220" height="275" rx="24" fill="#3f3f46" opacity="0.4" transform="rotate(8 266 233)" />
  <rect x="136" y="106" width="220" height="275" rx="24" fill="#52525b" opacity="0.6" transform="rotate(-4 246 243)" />

  <!-- Primary Carousel Slide (4:5 Aspect Ratio) -->
  <rect x="146" y="118" width="220" height="275" rx="24" fill="url(#cardGrad)" stroke="#71717a" stroke-width="4" />

  <!-- Slide Header Bar Accent -->
  <rect x="170" y="142" width="64" height="12" rx="6" fill="url(#purpleGrad)" />

  <!-- Instagram 4:5 Content Block (Mockup image area) -->
  <rect x="170" y="168" width="172" height="135" rx="14" fill="#27272a" />
  
  <!-- Image accent inner elements -->
  <circle cx="216" cy="216" r="22" fill="url(#purpleGrad)" opacity="0.9" />
  <path d="M182 280 L230 236 L270 270 L306 244 L330 280 Z" fill="#3f3f46" />

  <!-- Text lines mockup -->
  <rect x="170" y="320" width="140" height="10" rx="5" fill="#f4f4f5" />
  <rect x="170" y="338" width="90" height="8" rx="4" fill="#a1a1aa" />
  <rect x="170" y="354" width="120" height="8" rx="4" fill="#71717a" />

  <!-- "AO" Floating Badge -->
  <g transform="translate(86, 310)">
    <rect width="112" height="112" rx="28" fill="url(#purpleGrad)" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.5))" />
    <rect x="4" y="4" width="104" height="104" rx="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" />
    <text x="56" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">AO</text>
  </g>

  <!-- Carousel Dots Indicator (Bottom) -->
  <circle cx="236" cy="438" r="6" fill="#a855f7" />
  <circle cx="256" cy="438" r="6" fill="#71717a" />
  <circle cx="276" cy="438" r="6" fill="#71717a" />
</svg>
